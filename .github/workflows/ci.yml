name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate quality
        run: npm run validate:quality

  coverage:
    name: TypeScript tests and coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with exact coverage thresholds
        run: npm run test:coverage

  api_gap:
    name: API gap analyzer tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run analyzer tests with bounded concurrency
        run: npm run test:api-gap

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and validate exports
        run: npm run validate:package

  ci:
    name: CI
    if: always()
    needs: [quality, coverage, api_gap, package]
    runs-on: ubuntu-latest

    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          API_GAP_RESULT: ${{ needs.api_gap.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$API_GAP_RESULT" = success
          test "$PACKAGE_RESULT" = success
