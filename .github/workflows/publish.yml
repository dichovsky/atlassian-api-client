name: Publish

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release-sha: ${{ steps.release.outputs.release_sha }}
      manifest-sha256: ${{ steps.release.outputs.manifest_sha256 }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated, verified tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]; then
            echo 'Expected a stable release tag in the form vX.Y.Z' >&2
            exit 1
          fi
          tag_object_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" |
              jq -er 'select(.object.type == "tag") | .object.sha'
          )"
          tag_object="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}"
          )"
          release_sha="$(
            jq -er \
              'select(.object.type == "commit") | select(.verification.verified == true) | .object.sha' \
              <<<"${tag_object}"
          )"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${release_sha}"

          manifest_sha256="$(openssl dgst -sha256 -r <package.json | cut -d' ' -f1)"
          echo "release_sha=${release_sha}" >>"${GITHUB_OUTPUT}"
          echo "version=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"
          echo "manifest_sha256=${manifest_sha256}" >>"${GITHUB_OUTPUT}"

      - name: Require the exact current main tip
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "${RELEASE_SHA}"

      - name: Require successful CI for this exact main push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha='${{ steps.release.outputs.release_sha }}'
          runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_sha}&branch=main&event=push&status=success&per_page=100"
          )"
          successful_runs="$(
            jq -er --arg sha "${release_sha}" \
              '[.workflow_runs[] | select(
                .head_sha == $sha and
                .head_branch == "main" and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              )] | length' \
              <<<"${runs}"
          )"
          test "${successful_runs}" -gt 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install release check dependencies
        run: npm ci --ignore-scripts

      - name: Match the tag to package metadata
        run: node scripts/validate-release-tag.js "$GITHUB_REF_NAME"

  build:
    name: Validate and pack the release
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      integrity: ${{ steps.pack.outputs.integrity }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release-sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Validate the release
        run: npm run validate

      - name: Pack the validated files
        id: pack
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          metadata="$(npm pack --ignore-scripts --json --pack-destination "${RUNNER_TEMP}")"
          integrity="$(jq -er --arg version "${VERSION}" \
            '.[] | select(.name == "atlassian-api-client" and .version == $version) | .integrity' <<<"${metadata}")"
          mv "${RUNNER_TEMP}/atlassian-api-client-${VERSION}.tgz" "${RUNNER_TEMP}/package.tgz"
          echo "integrity=${integrity}" >>"${GITHUB_OUTPUT}"

      - name: Upload the release tarball
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish to npm
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Recheck the current main tip after approval
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_sha}" = "${RELEASE_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Require npm trusted-publishing support
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          [[ "${npm_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]
          npm_major="${BASH_REMATCH[1]}"
          npm_minor="${BASH_REMATCH[2]}"
          npm_patch="${BASH_REMATCH[3]}"
          if ((npm_major < 11 || (npm_major == 11 && (npm_minor < 5 || (npm_minor == 5 && npm_patch < 1))))); then
            echo "npm >= 11.5.1 is required for trusted publishing; found ${npm_version}" >&2
            exit 1
          fi

      - name: Download the release tarball by ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/release

      - name: Check the downloaded tarball
        env:
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
          MANIFEST_SHA256: ${{ needs.preflight.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/release/package.tgz"
          actual_integrity="sha512-$(openssl dgst -sha512 -binary <"${tarball}" | openssl base64 -A)"
          test "${actual_integrity}" = "${EXPECTED_INTEGRITY}"
          # npm honors publishConfig from the tarball. Require the reviewed manifest.
          manifest_sha256="$(tar -xzOf "${tarball}" package/package.json | openssl dgst -sha256 -r | cut -d' ' -f1)"
          test "${manifest_sha256}" = "${MANIFEST_SHA256}"

      - name: Publish with trusted publishing and provenance
        run: npm publish --provenance --ignore-scripts "${RUNNER_TEMP}/release/package.tgz"

  verify:
    name: Verify published package
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Wait for the exact version to reach the registry
        env:
          PACKAGE_NAME: atlassian-api-client
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # npm can accept a publish and serve it only minutes later ("Your package
          # is being processed and may take a few minutes to become available").
          # 5.0.0 took about 5 minutes, so poll every 10 seconds for up to 20 minutes.
          max_attempts=121
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            published_version="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)"
            latest_version="$(npm view "${PACKAGE_NAME}" dist-tags.latest 2>/dev/null || true)"
            if [[ "${published_version}" == "${VERSION}" && "${latest_version}" == "${VERSION}" ]]; then
              exit 0
            fi
            if ((attempt == max_attempts)); then
              echo \
                "Registry did not return ${PACKAGE_NAME}@${VERSION} with dist-tags.latest=${VERSION}" \
                >&2
              exit 1
            fi
            sleep 10
          done

      - name: Check the registry tarball integrity
        env:
          PACKAGE_NAME: atlassian-api-client
          VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          set -euo pipefail
          served_integrity="$(npm view "${PACKAGE_NAME}@${VERSION}" dist.integrity)"
          test "${served_integrity}" = "${EXPECTED_INTEGRITY}"

      - name: Smoke-test the registry artifact
        env:
          PACKAGE_NAME: atlassian-api-client
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          verify_once() {
            local verify_root cli
            verify_root="$(mktemp -d)" || return 1
            cli="${verify_root}/node_modules/.bin/atlas"

            if npm install \
              --prefix "${verify_root}" \
              --ignore-scripts \
              --no-audit \
              --no-fund \
              "${PACKAGE_NAME}@${VERSION}" &&
              test -x "${cli}" &&
              test "$("${cli}" --version)" = "atlas v${VERSION}" &&
              (
                cd "${verify_root}" &&
                  node --input-type=module -e '
                    const pkg = await import("atlassian-api-client");
                    const config = {
                      baseUrl: "https://release-verification.atlassian.net",
                      auth: { type: "bearer", token: "verification-only" },
                    };
                    const confluence = new pkg.ConfluenceClient(config);
                    const jira = new pkg.JiraClient(config);
                    if (!confluence.pages || !jira.issues) {
                      throw new Error("Constructed clients are missing core resources");
                    }
                  ' &&
                  npm audit signatures &&
                  "${cli}" install-skill --path "${verify_root}/installed-skill" &&
                  grep -Fx "version: ${VERSION}" "${verify_root}/installed-skill/SKILL.md"
              ); then
              rm -rf "${verify_root}"
              return 0
            fi

            rm -rf "${verify_root}"
            return 1
          }

          for attempt in {1..6}; do
            if verify_once; then
              exit 0
            fi
            if ((attempt == 6)); then
              echo "Published artifact verification failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 15
          done

      # npm audit signatures also passes for a package with no attestation, so
      # require SLSA provenance that names this repository, workflow, and tag.
      - name: Require provenance from this repository and workflow
        env:
          PACKAGE_NAME: atlassian-api-client
          VERSION: ${{ needs.preflight.outputs.version }}
          REPOSITORY_URL: https://github.com/dichovsky/atlassian-api-client
        run: |
          set -euo pipefail
          slsa_v1='https://slsa.dev/provenance/v1'
          test "$(npm view "${PACKAGE_NAME}@${VERSION}" dist.attestations.provenance.predicateType)" = "${slsa_v1}"
          attestations_url="$(npm view "${PACKAGE_NAME}@${VERSION}" dist.attestations.url)"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${attestations_url}" |
            jq -e \
              --arg type "${slsa_v1}" \
              --arg repository "${REPOSITORY_URL}" \
              --arg ref "refs/tags/v${VERSION}" \
              '[.attestations[]
                | select(.predicateType == $type)
                | .bundle.dsseEnvelope.payload | @base64d | fromjson
                | .predicate.buildDefinition.externalParameters.workflow
                | select(.repository == $repository and .path == ".github/workflows/publish.yml" and .ref == $ref)
              ] | length == 1' >/dev/null
